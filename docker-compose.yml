services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # this is for remote servers because we need
    # to map localhost on the machine to localhost of container
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    # --config.file: Tells the Prometheus binary exactly where to
    # look for its configuration. We mapped the local prometheus.yml
    # to this internal path in the volumes section, so this command
    # ensures Prometheus actually reads it.

    # --storage.tsdb.path: Defines where the Time Series Database (TSDB)
    # stores the actual data (your historical metrics). We point this to
    # /prometheus because that is where the persistent Docker volume is mounted.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # credentials from .env
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}

  # This monitors the server/machine you're using
  # (my debian)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    # --path.procfs, --path.rootfs, --path.sysfs: By default, Node Exporter
    # looks at /proc and /sys to find CPU and RAM info. Since it's in a container,
    # those folders only show "container" stats. These flags tell it to look at
    # the folders we mounted on the actual machine host instead in volumes section.

    # Exclusion Filter: This is a regex that tells Node Exporter:
    # "Ignore virtual file systems like /dev or /proc when reporting Disk Usage."
    # This keeps your dashboard clean so you only see your actual hard drives
    # (like / or /home) rather than 20 tiny system partitions.
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  cadvisor:
    # use the image below instead of 'google/cadvisor:latest'
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    restart: unless-stopped
    # cAdvisor requires root-level access to the host's kernel information
    # to collect container metrics accurately.
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "8083:8080"

  # Loki: The central storage engine for all logs (The "database" for text logs)
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    ports:
      - "3100:3100"
    # Uses Loki's default internal configuration file
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail: The log collector that grabs container logs and pushes them to Loki
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      # Mounts the custom configuration file created in this dir
      - ./promtail-config.yml:/etc/promtail/config.yml
      # Allows Promtail to talk to Docker daemon to read other container logs
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Allows Promtail to read system logs from the underlying Debian host
      - /var/log:/var/log
    # Explicitly tells Promtail to read the custom configuration mount
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      # Ensures Loki starts up completely before Promtail tries to stream logs to it
      - loki

  # Tempo: The storage backend for distributed tracing (Maps user request pathways)
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    volumes:
      # Mounts the custom configuration file created in this dir
      - ./tempo-config.yml:/etc/tempo.yaml
    # boot Tempo using the custom config
    # the grafana/tempo image explicitly expects the cleaner Exec Form (Array)
    # to ensure it never drops traces during a reboot.
    command: [ "--config.file=/etc/tempo.yaml" ]
    ports:
      # Tempo's web API port (Grafana uses this to fetch and display traces)
      - "3200:3200"
      # OTLP gRPC ingest (Your Spring Boot app can send traces here)
      - "4317:4317"
      # OTLP HTTP ingest port. Alternative endpoint for apps utilizing HTTP-based tracing.
      - "4318:4318"
    restart: unless-stopped


volumes:
  prometheus_data:
  grafana_data:
