# anytime you make changes in this file, run:
# curl -X POST http://localhost:9090/-/reload
# This reloads the alert rules for prometheus without
# prometheus dropping active connections (if docker restart prometheus),
# grafana dashboards won't show gaps or pauses, and if you made a syntax
# error in this YAML, Prometheus will log the error but keep running
# the old rules safely rather than crashing the container.

groups:
  - name: node_exporter_alerts
    rules:
      # Alert if a server goes completely offline
      - alert: InstanceDown
        # expr: up{job="node"} == 0   # this is for node-exporter only (server)
        expr: up == 0      # this is for all services
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "The Node Exporter target has been offline for more than 1 minute."

      # Alert if CPU usage is sustained above 90%
      - alert: HighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU usage is at {{ printf \"%.2f\" $value }}% for the last 5 minutes."

      # Alert if Low Memory (Less than 10% remaining)
      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low Memory on {{ $labels.instance }}"
          description: "Available memory has dropped below 10% (Current: {{ printf \"%.2f\" $value }}%)."

  - name: spring_boot_app_alerts
    rules:
      # HikariCP connection pool alerts
      - alert: HikariPoolNearExhaustion
        expr: hikaricp_connections_active{pool="WalletApp-HikariPool"} > 16
        # reduced form 2m to 10s to catch load test's 30s duration spikes
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "HikariCP pool utilizing > 80% capacity"
          description: "Active connections are at {{ $value }} out of a max pool size of 20."

      - alert: HikariPoolPendingThreads
        expr: hikaricp_connections_pending{pool="WalletApp-HikariPool"} > 0
        # 1m to 0s so if any thread blocks for a connection we know immediately.
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Threads are waiting for database connections!"
          description: "There are currently {{ $value }} threads blocked waiting to get a database connection."

      # Application Error Alerts
      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.*"}[5m]) > 1
        # 2m to 15s to catch alerts for the load test's 30s duration
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Spike in Application Errors (5xx status codes)"
          description: "The application is throwing internal server exceptions at a rate of {{ $value }} per second."
