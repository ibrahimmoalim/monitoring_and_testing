- hosts: remote_servers
  become: true
  tasks:

  - name: install apache2 and node-exporter
    apt:
      update_cache: true
      name:
        - apache2
        - prometheus-node-exporter
      state: present

  - name: enable and start node-exporter service
    service:
      name: prometheus-node-exporter
      state: started
      enabled: true
