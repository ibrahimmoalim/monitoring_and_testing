name: Playwright Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    run_tests:
        timeout-minutes: 10
        runs-on: ubuntu-latest
        defaults:
            run:
                # all 'run' commands in this job will be
                # run in playright dir
                # this does not apply to '- uses'
                working-directory: playwright/

        steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-node@v6
          with:
            node-version: lts/*
        - name: list files and check node and npm versions
          # '|' allows you to run multiple commands in order
          run: |
            ls -la
            node -v
            npm -v
        - name: Install dependencies
          run: npm ci
        - name: Install Playwright Browsers
          run: npx playwright install --with-deps
        - name: Run Playwright tests
          run: npx playwright test compliments --project=chromium
        - uses: actions/upload-artifact@v6
          if: ${{ !cancelled() }}
          with:
            name: playwright-report
            path: playwright/playwright-report/
            retention-days: 30
